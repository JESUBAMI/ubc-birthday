<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="image/favicon.png">
    <title>Thank You | University Baptist Church</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="thank-you-page">
    <div class="page-shell">
        <div class="card glow-card">
            <img class="brand-logo small" src="image/logo.png" width="88" height="100" alt="University Baptist Church logo">
            <div class="thank-you-icon">✓</div>
            <h1>Thank You!</h1>
            <p id="thankYouMessage">Your birthday registration has been received and will be shared in our weekly bulletin.</p>
            <p class="share-note">Know someone whose birthday is not in the bulletin? Invite them.</p>
            <div class="actions">
                <a id="shareWhatsApp" class="share-btn" href="https://wa.me/" target="_blank" rel="noopener noreferrer">Share with a friend on WhatsApp</a>
                <a class="secondary-link" href="index.html">Register another person</a>
            </div>
        </div>
    </div>

    <script src="thank-you.js"></script>
</body>

</html>
